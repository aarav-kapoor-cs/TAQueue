# Day-to-day development: start only the database
#     docker compose up -d db
# and run the backend and frontend on your machine (see README).
#
# Whole stack in containers:
#     docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taqueue
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

  backend:
    build: ./backend
    environment:
      # Inside Docker the database's hostname is the service name, "db".
      DATABASE_URL: postgresql://postgres:postgres@db:5432/taqueue
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
